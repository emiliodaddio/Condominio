<!-- SEZIONE ANAGRAFICA & MILLESIMI -->
<section id="section-unita" class="hidden space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-extrabold text-slate-800">Unità e Tabelle Millesimali</h2>
        <button onclick="openUnitaModal()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 transition-all admin-only">
            <i class="fa-solid fa-plus mr-2"></i> Nuova Unità
        </button>
    </div>
    
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                        <th class="px-6 py-4 font-bold">Unità</th>
                        <th class="px-6 py-4 font-bold">Tipo</th>
                        <th class="px-6 py-4 font-bold">Condòmino</th>
                        <th class="px-6 py-4 font-bold">Mill. Proprietà (A)</th>
                        <th class="px-6 py-4 font-bold">Mill. Scale (B)</th>
                        <th class="px-6 py-4 font-bold">Mill. Ascensore (C)</th>
                        <th class="px-6 py-4 font-bold text-right admin-only">Azioni</th>
                    </tr>
                </thead>
                <tbody id="unita-list" class="divide-y divide-slate-100 text-sm">
                    <!-- Popolato via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modale Unità -->
    <div id="unita-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800" id="unita-modal-title">Nuova Unità</h3>
                <button onclick="closeUnitaModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="unita-form" onsubmit="saveUnita(event)" class="p-6 space-y-4">
                <input type="hidden" id="unita-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Identificativo (es. Int. 1)</label>
                        <input type="text" id="unita-identificativo" required class="w-full p-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Tipo</label>
                        <select id="unita-tipo" class="w-full p-2 border rounded-xl">
                            <option value="Appartamento">Appartamento</option>
                            <option value="Box">Box / Garage</option>
                            <option value="Cantina">Cantina</option>
                            <option value="Negozio">Negozio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Scala</label>
                        <input type="text" id="unita-scala" class="w-full p-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Piano</label>
                        <input type="text" id="unita-piano" class="w-full p-2 border rounded-xl">
                    </div>
                </div>
                
                <hr class="border-slate-100">
                <h4 class="text-sm font-bold text-slate-700">Tabelle Millesimali</h4>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Proprietà (A)</label>
                        <input type="number" step="0.01" id="unita-mill-prop" value="0" required class="w-full p-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Scale (B)</label>
                        <input type="number" step="0.01" id="unita-mill-scale" value="0" class="w-full p-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Ascensore (C)</label>
                        <input type="number" step="0.01" id="unita-mill-asc" value="0" class="w-full p-2 border rounded-xl">
                    </div>
                </div>

                <hr class="border-slate-100">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Proprietario / Condòmino (User ID)</label>
                    <input type="number" id="unita-user-id" placeholder="ID Utente (es. 3 per Mario Rossi)" class="w-full p-2 border rounded-xl">
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">Salva Unità</button>
            </form>
        </div>
    </div>
</section>
